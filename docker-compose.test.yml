services:
  mcserver-manager-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcserver-manager:test
    container_name: mcserver-manager-test
    restart: "no"
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:25566:25565"
    environment:
      PORT: 3000
      NODE_ENV: production
      SERVER_ROOT: /data
      FILE_EXPLORER_ROOT: /data
      ALLOWED_ROOTS: /data
      PANEL_CONFIG_PATH: /data/panel-config.json
      MINECRAFT_AUTOSTART: "false"
      PLAYIT_AUTOSTART: "false"
      PLAYIT_LOCAL_PORT: 25565
      MASTER_PASSWORD: test-password-change-me
      JWT_SECRET: test-jwt-secret-change-me
    volumes:
      # The fixture is copied into the container's persistent data root for
      # this local test. Production uses the named mcserver-data volume above.
      - ./test:/data:rw
