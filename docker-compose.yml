services:
  mcserver-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcserver-manager:latest
    container_name: mcserver-manager
    restart: unless-stopped
    ports:
      # Web panel & WebSocket
      - "3000:3000"
      # Minecraft Java server
      - "25565:25565"
    environment:
      PORT: 3000
      NODE_ENV: production
      SERVER_ROOT: /data
      FILE_EXPLORER_ROOT: /data
      ALLOWED_ROOTS: /data
      PANEL_CONFIG_PATH: /data/panel-config.json
      MINECRAFT_AUTOSTART: ${MINECRAFT_AUTOSTART:-true}
      PLAYIT_AUTOSTART: ${PLAYIT_AUTOSTART:-false}
      PLAYIT_LOCAL_PORT: ${PLAYIT_LOCAL_PORT:-25565}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Set MASTER_PASSWORD in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
    volumes:
      # Minecraft, NeoForge, mods, worlds, Playit and panel configuration
      # all persist together and are managed by the process inside this
      # container. Only the persistent Docker volume is used.
      - mcserver-data:/data:rw
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mcserver-data:
